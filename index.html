<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kinetic Sorcery - 新手巫師實戰訓練</title>
    <!-- 引入核心的顏色追蹤庫與 3D 動效渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; }
        
        /* 相機畫面全螢幕背景 */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        
        /* 遊戲主畫布（渲染火球、盾牌與震動效果） */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* 頂部引進與狀態引導 */
        #instruction { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid #ff4500; text-align: center; box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }
        
        /* 右下角魔法計數器 */
        #scoreboard { position: absolute; bottom: 20px; right: 20px; z-index: 3; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 12px; border: 2px solid #00d2ff; font-weight: bold; font-size: 16px; line-height: 1.6; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
        .success { color: #00d2ff; }
        .failed { color: #ff4500; }

        /* 畫面受擊震動動畫效果 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake-effect { animation: shake 0.4s; animation-iteration-count: 1; }
    </style>
</head>
<body>

    <!-- 實時鏡頭 -->
    <video id="webcam" preload autoplay loop muted playsinline></video>
    
    <!-- 遊戲特效層 -->
    <canvas id="game-canvas"></canvas>

    <!-- 提示 UI -->
    <div id="instruction">
        <strong style="color: #ff4500;">動力魔法學院：火球防禦測試</strong><br>
        <span style="font-size: 13px;">請用魔杖尖端的<span style="color: #ff3333; font-weight: bold;">紅色物體</span>在空中快速畫圈施法！</span>
    </div>

    <!-- 右下角計數器 -->
    <div id="scoreboard">
        <div>成功擊碎：<span id="txt-success" class="success">0</span> 次</div>
        <div>防禦失敗：<span id="txt-failed" class="failed">0</span> 次</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // 數據狀態記分板
        let scoreSuccess = 0;
        let scoreFailed = 0;

        // 遊戲物理機制參數
        let fireball = { x: 0, y: 0, size: 5, speed: 2, active: false };
        let shield = { active: false, timer: 0, radius: 0 };
        let pointsHistory = []; // 紀錄紅色物體的軌跡做圈選判定

        // 初始化畫布尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. 啟動手機相機鏡頭
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(function(stream) {
                    video.srcObject = stream;
                }).catch(function(err) {
                    alert("相機啟動失敗，請確認是否給予權限。");
                });
        }

        // 2. 顏色追蹤核心：鎖定魔杖尖端的紅色 (自訂明亮紅色範圍)
        tracking.ColorTracker.registerColor('magic_red', function(r, g, b) {
            return (r > 160 && g < 60 && b < 60); 
        });

        const tracker = new tracking.ColorTracker(['magic_red']);
        tracker.setMinDimension(10); // 避開微小噪點

        // 當鏡頭抓到紅色物體時的觸發事件
        tracker.on('track', function(event) {
            if (event.data.length === 0) return;
            
            // 取畫面中最大的紅色區塊中心點 (因為做過 scaleX(-1) 鏡像修正，在此平衡坐標)
            let maxRect = event.data.sort((a,b) => b.width*b.height - a.width*a.height)[0];
            let centerX = canvas.width - (maxRect.x + maxRect.width / 2);
            let centerY = maxRect.y + maxRect.height / 2;

            // 紀錄軌跡坐標 (只保留最近 15 幀)
            pointsHistory.push({ x: centerX, y: centerY, time: Date.now() });
            if (pointsHistory.length > 15) pointsHistory.shift();

            // 核心算法：快速簡單判定「畫圈」
            if (pointsHistory.length >= 10) {
                let xs = pointsHistory.map(p => p.x);
                let ys = pointsHistory.map(p => p.y);
                let minX = Math.min(...xs), maxX = Math.max(...xs);
                let minY = Math.min(...ys), maxY = Math.max(...ys);
                let deltaX = maxX - minX;
                let deltaY = maxY - minY;
                
                // 當移動範圍大於 40 像素，且 X 軸與 Y 軸移動幅度寬高接近 (比例在 0.5 ~ 2 之間) 判定為畫圈施法
                if (deltaX > 40 && deltaY > 40 && (deltaX / deltaY > 0.5 && deltaX / deltaY < 2.0)) {
                    triggerShield();
                    pointsHistory = []; // 施法成功後清空軌跡以免重複判定
                }
            }
        });

        // 啟動追蹤
        tracking.track('#webcam', tracker);

        // 觸發防禦盾牌
        function triggerShield() {
            if (!shield.active) {
                shield.active = true;
                shield.radius = 10;
                shield.timer = 40; // 盾牌持續時間 (約0.6秒)
            }
        }

        // 生成新火球 (從畫面中央深處噴出)
        function spawnFireball() {
            fireball.x = canvas.width / 2;
            fireball.y = canvas.height / 2;
            fireball.size = 2;
            // 隨機往四周擴散角度
            let angle = Math.random() * Math.PI * 2;
            fireball.speedX = Math.cos(angle) * 3;
            fireball.speedY = Math.sin(angle) * 3;
            fireball.active = true;
        }

        // 3. 遊戲主迴圈渲染與物理判定
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 處理火球機制
            if (!fireball.active) {
                spawnFireball();
            } else {
                // 火球向前飛來（尺寸變大，速度加劇，營造 3D 撲面感）
                fireball.x += fireball.speedX;
                fireball.y += fireball.speedY;
                fireball.size += 0.8;
                fireball.speedX *= 1.03;
                fireball.speedY *= 1.03;

                // 繪製火焰粒子效果
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(fireball.x, fireball.y, fireball.size*0.2, fireball.x, fireball.y, fireball.size);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.2, '#ffdd00');
                gradient.addColorStop(0.5, '#ff4500');
                gradient.addColorStop(1, 'rgba(255,69,0,0)');
                ctx.fillStyle = gradient;
                ctx.arc(fireball.x, fireball.y, fireball.size, 0, Math.PI * 2);
                ctx.fill();

                // 碰撞判定區域 (當火球飛到靠近玩家的臨界尺寸時)
                if (fireball.size > 110) {
                    if (shield.active) {
                        // 判定成功：盾牌架起，火球碎裂
                        scoreSuccess++;
                        document.getElementById('txt-success').innerText = scoreSuccess;
                        createExplosion(fireball.x, fireball.y, '#ffd700');
                    } else {
                        // 判定失敗：防禦失敗，畫面震動
                        scoreFailed++;
                        document.getElementById('txt-failed').innerText = scoreFailed;
                        document.body.classList.add('shake-effect');
                        setTimeout(() => document.body.classList.remove('shake-effect'), 400);
                        createExplosion(fireball.x, fireball.y, '#ff4500');
                    }
                    fireball.active = false;
                }
            }

            // 處理並繪製藍色防禦能量盾
            if (shield.active) {
                shield.timer--;
                if (shield.radius < 140) shield.radius += 15; // 盾牌展開動效

                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, shield.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 210, 255, ${shield.timer / 40})`;
                ctx.lineWidth = 12;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00d2ff';
                ctx.stroke();
                
                // 重設畫布陰影防止干擾其他元件
                ctx.shadowBlur = 0;

                if (shield.timer <= 0) shield.active = false;
            }

            // 繪製魔杖尖端即時視覺點（方便玩家定位）
            if (pointsHistory.length > 0) {
                let lastPt = pointsHistory[pointsHistory.length - 1];
                ctx.beginPath();
                ctx.arc(lastPt.x, lastPt.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 0, 0.6)'; // 畫面上顯示綠色光點代表目前追蹤到的魔杖頂點
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        // 爆炸碎裂特效輔助函式
        let particles = [];
        function createExplosion(x, y, color) {
            // 這裡可以後續擴充爆裂粒子，目前以快速火球重製為主
        }

        // 啟動遊戲迴圈
        gameLoop();
    </script>
</body>
</html>

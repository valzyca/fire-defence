<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kinetic Sorcery - 新手巫師實戰訓練</title>
    <!-- 引入核心的顏色追蹤庫與 3D 動效渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; }
        
        /* 相機畫面全螢幕背景 */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        
        /* 遊戲主畫布（渲染火球、盾牌與震動效果） */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* 頂部引進與狀態引導 */
        #instruction { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid #ff4500; text-align: center; box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }
        
        /* 右下角魔法計數器 */
        #scoreboard { position: absolute; bottom: 20px; right: 20px; z-index: 3; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 12px; border: 2px solid #00d2ff; font-weight: bold; font-size: 16px; line-height: 1.6; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
        .success { color: #00d2ff; }
        .failed { color: #ff4500; }

        /* 第7次受擊後的「全螢幕紅色呼吸警告層」 */
        #danger-glow-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.8); /* 內陰影造成邊緣血絲感 */
            background-color: rgba(255, 0, 0, 0);
        }

        /* 紅色呼吸動畫 */
        @keyframes redPulse {
            0% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
            50% { background-color: rgba(255, 0, 0, 0.25); box-shadow: inset 0 0 120px rgba(255, 0, 0, 0.9); }
            100% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
        }
        .pulse-effect { animation: redPulse 1.8s infinite ease-in-out; }

        /* 遊戲結束特大文字畫面 */
        #game-over-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4; background: rgba(0, 0, 0, 0.85);
            flex-direction: column; justify-content: center; align-items: center;
            color: #ff3333; text-align: center; cursor: pointer;
        }
        #game-over-text { font-size: 64px; font-weight: bold; text-shadow: 0 0 20px #ff0000; margin-bottom: 20px; letter-spacing: 2px; }
        #restart-hint { color: #aaaaaa; font-size: 18px; animation: blink 1.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* 畫面受擊震動動畫效果 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake-effect { animation: shake 0.4s; animation-iteration-count: 1; }
    </style>
</head>
<body>

    <!-- 實時鏡頭 -->
    <video id="webcam" preload autoplay loop muted playsinline></video>
    
    <!-- 遊戲特效層 -->
    <canvas id="game-canvas"></canvas>

    <!-- 危機紅色呼吸層 -->
    <div id="danger-glow-screen"></div>

    <!-- 提示 UI -->
    <div id="instruction">
        <strong style="color: #ff4500;">動力魔法學院：火球防禦測試</strong><br>
        <span style="font-size: 13px;">請用魔杖尖端的<span style="color: #ff3333; font-weight: bold;">紅色物體</span>在空中快速畫圈施法！</span>
    </div>

    <!-- 右下角計數器 -->
    <div id="scoreboard">
        <div>成功擊碎：<span id="txt-success" class="success">0</span> 次</div>
        <div>防禦失敗：<span id="txt-failed" class="failed">0</span> 次</div>
    </div>

    <!-- 失敗退出畫面 -->
    <div id="game-over-screen" onclick="resetGame()">
        <div id="game-over-text">You're Fail.</div>
        <div id="restart-hint">點擊畫面重新挑戰</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const dangerGlowScreen = document.getElementById('danger-glow-screen');

        // 數據狀態記分板
        let scoreSuccess = 0;
        let scoreFailed = 0;
        let isGameOver = false;

        // 遊戲物理機制參數
        let fireball = { x: 0, y: 0, size: 5, speedX: 0, speedY: 0, active: false };
        let shield = { active: false, timer: 0, radius: 0 };
        let pointsHistory = []; 

        // 初始化畫布尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. 啟動手機相機鏡頭（優化版前鏡頭機制）
        const videoConstraints = {
            audio: false,
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        };

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia(videoConstraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play().catch(function(e) { console.log("播放失敗", e); });
                }).catch(function(err) {
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(function(stream) {
                            video.srcObject = stream;
                        }).catch(function(e) {
                            alert("相機啟動失敗，請確認是否給予相機權限。");
                        });
                });
        }

        // 2. 顏色追蹤核心：鎖定魔杖尖端的紅色
        tracking.ColorTracker.registerColor('magic_red', function(r, g, b) {
            return (r > 150 && g < 70 && b < 70); 
        });

        const tracker = new tracking.ColorTracker(['magic_red']);
        tracker.setMinDimension(10);

        tracker.on('track', function(event) {
            if (isGameOver || event.data.length === 0) return;
            
            let maxRect = event.data.sort((a,b) => b.width*b.height - a.width*a.height)[0];
            let centerX = canvas.width - (maxRect.x + maxRect.width / 2);
            let centerY = maxRect.y + maxRect.height / 2;

            pointsHistory.push({ x: centerX, y: centerY });
            if (pointsHistory.length > 15) pointsHistory.shift();

            if (pointsHistory.length >= 10) {
                let xs = pointsHistory.map(p => p.x);
                let ys = pointsHistory.map(p => p.y);
                let minX = Math.min(...xs), maxX = Math.max(...xs);
                let minY = Math.min(...ys), maxY = Math.max(...ys);
                let deltaX = maxX - minX;
                let deltaY = maxY - minY;
                
                if (deltaX > 40 && deltaY > 40 && (deltaX / deltaY > 0.5 && deltaX / deltaY < 2.0)) {
                    triggerShield();
                    pointsHistory = []; 
                }
            }
        });

        tracking.track('#webcam', tracker);

        function triggerShield() {
            if (!shield.active && !isGameOver) {
                shield.active = true;
                shield.radius = 10;
                shield.timer = 40; 
            }
        }

        function spawnFireball() {
            if (isGameOver) return;
            fireball.x = canvas.width / 2;
            fireball.y = canvas.height / 2;
            fireball.size = 2;
            let angle = Math.random() * Math.PI * 2;
            fireball.speedX = Math.cos(angle) * 3;
            fireball.speedY = Math.sin(angle) * 3;
            fireball.active = true;
        }

        // 3. 遊戲主迴圈
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isGameOver) {
                if (!fireball.active) {
                    spawnFireball();
                } else {
                    fireball.x += fireball.speedX;
                    fireball.y += fireball.speedY;
                    fireball.size += 0.9; 
                    fireball.speedX *= 1.03;
                    fireball.speedY *= 1.03;

                    ctx.beginPath();
                    let gradient = ctx.createRadialGradient(fireball.x, fireball.y, fireball.size*0.2, fireball.x, fireball.y, fireball.size);
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.2, '#ffdd00');
                    gradient.addColorStop(0.5, '#ff4500');
                    gradient.addColorStop(1, 'rgba(255,69,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(fireball.x, fireball.y, fireball.size, 0, Math.PI * 2);
                    ctx.fill();

                    if (fireball.size > 120) {
                        if (shield.active) {
                            scoreSuccess++;
                            document.getElementById('txt-success').innerText = scoreSuccess;
                        } else {
                            scoreFailed++;
                            document.getElementById('txt-failed').innerText = scoreFailed;
                            
                            // 畫面震動
                            document.body.classList.add('shake-effect');
                            setTimeout(() => document.body.classList.remove('shake-effect'), 400);

                            // 核心判定：當防禦失敗達到 7 次，開啟全螢幕紅色呼吸警告
                            if (scoreFailed >= 7 && scoreFailed < 10) {
                                dangerGlowScreen.style.display = 'block';
                                dangerGlowScreen.classList.add('pulse-effect');
                            }

                            // 檢查是否觸發失敗退出機制 (10次)
                            if (scoreFailed >= 10) {
                                triggerGameOver();
                            }
                        }
                        fireball.active = false;
                    }
                }
            }

            // 繪製盾牌
            if (shield.active && !isGameOver) {
                shield.timer--;
                if (shield.radius < 140) shield.radius += 15;

                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, shield.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 210, 255, ${shield.timer / 40})`;
                ctx.lineWidth = 12;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00d2ff';
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (shield.timer <= 0) shield.active = false;
            }

            // 顯示紅色追蹤光點位置
            if (pointsHistory.length > 0 && !isGameOver) {
                let lastPt = pointsHistory[pointsHistory.length - 1];
                ctx.beginPath();
                ctx.arc(lastPt.x, lastPt.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 0, 0.6)';
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        // 觸發遊戲結束
        function triggerGameOver() {
            isGameOver = true;
            fireball.active = false;
            shield.active = false;
            dangerGlowScreen.style.display = 'none'; // 隱藏呼吸層
            dangerGlowScreen.classList.remove('pulse-effect');
            gameOverScreen.style.display = 'flex'; 
        }

        // 重設遊戲機制
        function resetGame() {
            scoreSuccess = 0;
            scoreFailed = 0;
            isGameOver = false;
            document.getElementById('txt-success').innerText = "0";
            document.getElementById('txt-failed').innerText = "0";
            dangerGlowScreen.style.display = 'none'; // 隱藏並清空呼吸狀態
            dangerGlowScreen.classList.remove('pulse-effect');
            gameOverScreen.style.display = 'none';
            pointsHistory = [];
            spawnFireball();
        }

        gameLoop();
    </script>
</body>
</html>

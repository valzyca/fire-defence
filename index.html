<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kinetic Sorcery - 新手巫師實戰訓練</title>
    <!-- 引入核心的顏色追蹤庫與 3D 動效渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; }
        
        /* 相機畫面全螢幕背景 */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        
        /* 遊戲主畫布（渲染火球、準星與震動效果） */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* 頂部引進與狀態引導 */
        #instruction { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid #ff4500; text-align: center; box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }
        
        /* 右下角魔法計數器 */
        #scoreboard { position: absolute; bottom: 20px; right: 20px; z-index: 3; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 12px; border: 2px solid #00d2ff; font-weight: bold; font-size: 16px; line-height: 1.6; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
        .success { color: #00d2ff; }
        .failed { color: #ff4500; }

        /* 第7次受擊後的「全螢幕紅色呼吸警告層」 */
        #danger-glow-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.8);
            background-color: rgba(255, 0, 0, 0);
        }

        /* 紅色呼吸動畫 */
        @keyframes redPulse {
            0% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
            50% { background-color: rgba(255, 0, 0, 0.25); box-shadow: inset 0 0 120px rgba(255, 0, 0, 0.9); }
            100% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
        }
        .pulse-effect { animation: redPulse 1.8s infinite ease-in-out; }

        /* 遊戲結束特大文字畫面 */
        #game-over-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4; background: rgba(0, 0, 0, 0.85);
            flex-direction: column; justify-content: center; align-items: center;
            color: #ff3333; text-align: center; cursor: pointer;
        }
        #game-over-text { font-size: 64px; font-weight: bold; text-shadow: 0 0 20px #ff0000; margin-bottom: 20px; letter-spacing: 2px; }
        #restart-hint { color: #aaaaaa; font-size: 18px; animation: blink 1.5s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* 畫面受擊震動動畫效果 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake-effect { animation: shake 0.4s; animation-iteration-count: 1; }
    </style>
</head>
<body>

    <!-- 實時鏡頭 -->
    <video id="webcam" preload autoplay loop muted playsinline></video>
    
    <!-- 遊戲特效層 -->
    <canvas id="game-canvas"></canvas>

    <!-- 危機紅色呼吸層 -->
    <div id="danger-glow-screen"></div>

    <!-- 提示 UI -->
    <div id="instruction">
        <strong style="color: #ff4500;">動力魔法學院：幾何特徵狙擊</strong><br>
        <span style="font-size: 13px;">已鎖定<span style="color: #ff3333; font-weight: bold;">球狀紅色物體</span>！揮動魔杖精準攔截火球！</span>
    </div>

    <!-- 右下角計數器 -->
    <div id="scoreboard">
        <div>成功攔截：<span id="txt-success" class="success">0</span> 次</div>
        <div>防禦失敗：<span id="txt-failed" class="failed">0</span> 次</div>
    </div>

    <!-- 失敗退出畫面 -->
    <div id="game-over-screen" onclick="resetGame()">
        <div id="game-over-text">You're Fail.</div>
        <div id="restart-hint">點擊畫面重新挑戰</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const dangerGlowScreen = document.getElementById('danger-glow-screen');

        // 數據狀態記分板
        let scoreSuccess = 0;
        let scoreFailed = 0;
        let isGameOver = false;

        // 遊戲物理機制參數
        let fireball = { x: 0, y: 0, size: 5, speedX: 0, speedY: 0, active: false };
        let crosshair = { x: 0, y: 0, rotation: 0, targetSize: 35, currentSize: 35, hasTracking: false };
        let explosions = []; 

        // 1. 啟動手機相機鏡頭
        const videoConstraints = {
            audio: false,
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        };

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia(videoConstraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play().catch(function(e) { console.log("播放失敗", e); });
                }).catch(function(err) {
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(function(stream) {
                            video.srcObject = stream;
                        }).catch(function(e) {
                            alert("相機啟動失敗，請確認是否給予相機權限。");
                        });
                });
        }

        // 2. 顏色追蹤核心：進一步收緊紅色閾值，降低環境干擾
        tracking.ColorTracker.registerColor('magic_red', function(r, g, b) {
            // 收緊綠色與藍色的上限，確保只有極鮮豔的紅色才會被計入
            return (r > 165 && g < 55 && b < 55); 
        });

        const tracker = new tracking.ColorTracker(['magic_red']);
        tracker.setMinDimension(8); // 稍微調小限制，允許魔杖在較遠處也能被辨識

        tracker.on('track', function(event) {
            if (isGameOver) {
                crosshair.hasTracking = false;
                return;
            }
            
            if (event.data.length === 0) {
                crosshair.hasTracking = false;
                return;
            }
            
            // 【核心形狀過濾演算法】
            let validTarget = null;

            // 遍歷所有偵測到的紅色區塊，篩選出形狀最接近「圓形/正方形」的區塊
            for (let i = 0; i < event.data.length; i++) {
                let rect = event.data[i];
                let aspect = rect.width / rect.height;
                
                // 篩選條件：寬高比必須在 0.7 到 1.4 之間 (即接近正圓形或正方形)
                // 並且排除掉面積過大(大於螢幕1/4)的區塊，防止整件衣服被誤認
                if (aspect > 0.7 && aspect < 1.4 && rect.width < (canvas.width * 0.4)) {
                    // 如果有多個符合的，優先選擇寬高比最接近 1 (最圓) 的那個
                    if (!validTarget || Math.abs(1 - aspect) < Math.abs(1 - (validTarget.width / validTarget.height))) {
                        validTarget = rect;
                    }
                }
            }

            if (validTarget) {
                crosshair.hasTracking = true;
                // 鏡像坐標修正
                crosshair.x = canvas.width - (validTarget.x + validTarget.width / 2);
                crosshair.y = validTarget.y + validTarget.height / 2;
            } else {
                // 如果畫面上只有不規則的紅色(如衣服條紋)，則不顯示準星
                crosshair.hasTracking = false;
            }
        });

        tracking.track('#webcam', tracker);

        function spawnFireball() {
            if (isGameOver) return;
            fireball.x = canvas.width / 2;
            fireball.y = canvas.height / 2;
            fireball.size = 2;
            let angle = Math.random() * Math.PI * 2;
            fireball.speedX = Math.cos(angle) * 3;
            fireball.speedY = Math.sin(angle) * 3;
            fireball.active = true;
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                explosions.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 3,
                    alpha: 1,
                    color: `hsl(${Math.random() * 30 + 15}, 100%, 60%)`
                });
            }
        }

        function drawMagicCrosshair(x, y) {
            crosshair.rotation += 0.02;
            let dist = Math.hypot(x - fireball.x, y - fireball.y);
            if (fireball.active && dist < 100) {
                crosshair.targetSize = 25;
                ctx.strokeStyle = '#ff3333';
            } else {
                crosshair.targetSize = 35;
                ctx.strokeStyle = '#00d2ff';
            }
            crosshair.currentSize += (crosshair.targetSize - crosshair.currentSize) * 0.2;
            let r = crosshair.currentSize;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(crosshair.rotation);
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.setLineDash([6, 6]);
            ctx.stroke();

            ctx.beginPath();
            ctx.rect(-r*0.6, -r*0.6, r*1.2, r*1.2);
            ctx.setLineDash([]);
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-r*0.3, 0); ctx.lineTo(-r*0.1, 0);
            ctx.moveTo(r*0.1, 0);  ctx.lineTo(r*0.3, 0);
            ctx.moveTo(0, -r*0.3); ctx.lineTo(0, -r*0.1);
            ctx.moveTo(0, r*0.1);  ctx.lineTo(0, r*0.3);
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = explosions.length - 1; i >= 0; i--) {
                let p = explosions[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if (p.alpha <= 0) { explosions.splice(i, 1); continue; }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            if (!isGameOver) {
                if (!fireball.active) {
                    spawnFireball();
                } else {
                    fireball.x += fireball.speedX;
                    fireball.y += fireball.speedY;
                    fireball.size += 0.9;
                    fireball.speedX *= 1.03;
                    fireball.speedY *= 1.03;

                    ctx.beginPath();
                    let gradient = ctx.createRadialGradient(fireball.x, fireball.y, fireball.size*0.2, fireball.x, fireball.y, fireball.size);
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.2, '#ffdd00');
                    gradient.addColorStop(0.5, '#ff4500');
                    gradient.addColorStop(1, 'rgba(255,69,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(fireball.x, fireball.y, fireball.size, 0, Math.PI * 2);
                    ctx.fill();

                    if (crosshair.hasTracking) {
                        let distance = Math.hypot(crosshair.x - fireball.x, crosshair.y - fireball.y);
                        if (distance < (fireball.size*0.7 + crosshair.currentSize)) {
                            scoreSuccess++;
                            document.getElementById('txt-success').innerText = scoreSuccess;
                            createExplosion(fireball.x, fireball.y);
                            fireball.active = false;
                        }
                    }

                    if (fireball.active && fireball.size > 130) {
                        scoreFailed++;
                        document.getElementById('txt-failed').innerText = scoreFailed;
                        document.body.classList.add('shake-effect');
                        setTimeout(() => document.body.classList.remove('shake-effect'), 400);

                        if (scoreFailed >= 7 && scoreFailed < 10) {
                            dangerGlowScreen.style.display = 'block';
                            dangerGlowScreen.classList.add('pulse-effect');
                        }
                        if (scoreFailed >= 10) { triggerGameOver(); }
                        fireball.active = false;
                    }
                }

                if (crosshair.hasTracking) {
                    drawMagicCrosshair(crosshair.x, crosshair.y);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            fireball.active = false;
            dangerGlowScreen.style.display = 'none';
            dangerGlowScreen.classList.remove('pulse-effect');
            gameOverScreen.style.display = 'flex'; 
        }

        function resetGame() {
            scoreSuccess = 0;
            scoreFailed = 0;
            isGameOver = false;
            document.getElementById('txt-success').innerText = "0";
            document.getElementById('txt-failed').innerText = "0";
            dangerGlowScreen.style.display = 'none';
            dangerGlowScreen.classList.remove('pulse-effect');
            gameOverScreen.style.display = 'none';
            explosions = [];
            spawnFireball();
        }

        gameLoop();
    </script>
</body>
</html>
